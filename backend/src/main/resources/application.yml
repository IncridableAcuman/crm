spring:
  application:
    name: savdocrm-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:v8y/B?E(H+MbQeThWmZq4t7w!z%C*F-J@NcRfUjXn2r5u8x/A?D(G+KbPdSgVkYp}
  access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
  refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:2592000}
  issuer: ${JWT_ISSUER:savdocrm-auth}
  cookie-name: ${JWT_COOKIE_NAME:savdocrm_refresh_token}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  cookie-path: ${JWT_COOKIE_PATH:/api/v1/auth}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}


