services:
  postgres:
    image: postgres:16-alpine
    container_name: savdocrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savdocrm}
      POSTGRES_USER: ${POSTGRES_USER:-savdocrm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savdocrm_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savdocrm_user} -d ${POSTGRES_DB:-savdocrm}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
