spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/savdocrm}
    username: ${POSTGRES_USER:savdocrm_user}
    password: ${POSTGRES_PASSWORD:savdocrm_secret_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false

logging:
  level:
    com.savdocrm: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
