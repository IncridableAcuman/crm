spring:
  application:
    name: savdocrm-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:v8y/B?E(H+MbQeThWmZq4t7w!z%C*F-J@NcRfUjXn2r5u8x/A?D(G+KbPdSgVkYp}
  access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
  refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:2592000}
  issuer: ${JWT_ISSUER:savdocrm-auth}

